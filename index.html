<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 26px;
            color: #38bdf8;
            font-weight: 700;
        }

        header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        /* 3 Columns Responsive Cards */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .card.visits::before { background-color: #38bdf8; }
        .card.fb::before { background-color: #1877F2; }
        .card.chrome::before { background-color: #22c55e; }

        .card h3 {
            font-size: 13px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card .value {
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
        }

        .card.visits .value { color: #38bdf8; }
        .card.fb .value { color: #1877F2; }
        .card.chrome .value { color: #22c55e; }

        /* Analytics Chart Box */
        .analytics-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .analytics-box h2 {
            font-size: 19px;
            margin-bottom: 25px;
            color: #f1f5f9;
            font-weight: 600;
        }

        .progress-item {
            margin-bottom: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background-color: #334155;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 8px;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fb-fill { background: linear-gradient(90deg, #1877F2, #3b82f6); }
        .chrome-fill { background: linear-gradient(90deg, #22c55e, #10b981); }

        .status-message {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 25px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Landing Page Tracker Dashboard</h1>
            <p>গুগল শিট থেকে রিয়েল-টাইম ট্রাফিক অ্যানালিটিক্স রিপোর্ট</p>
        </div>
        <button class="refresh-btn" onclick="fetchData()">Refresh Data</button>
    </header>

    <div class="grid-cards">
        <div class="card visits">
            <h3>Total Visits (মোট ভিজিটর)</h3>
            <div class="value" id="totalVisits">0</div>
        </div>
        <div class="card fb">
            <h3>Facebook Clicks</h3>
            <div class="value" id="fbClicks">0</div>
        </div>
        <div class="card chrome">
            <h3>Chrome Clicks</h3>
            <div class="value" id="chromeClicks">0</div>
        </div>
    </div>

    <div class="analytics-box">
        <h2>Click Comparison Ratio (ক্লিক অনুপাত)</h2>
        <div class="progress-item">
            <div class="progress-label">
                <span>Facebook Browser Button Action</span>
                <span id="fbPercent" style="color: #1877F2;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill fb-fill" id="fbBar"></div>
            </div>
        </div>
        <div class="progress-item">
            <div class="progress-label">
                <span>Chrome Browser Button Action</span>
                <span id="chromePercent" style="color: #22c55e;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill chrome-fill" id="chromeBar"></div>
            </div>
        </div>
        <p class="status-message" id="statusText">ডাটা লোড হচ্ছে...</p>
    </div>
</div>

<script>
    // 🔴 আপনার নতুন আপডেট হওয়া Web App URL এখানে যুক্ত করা হয়েছে 🔴
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxGmcxNvAlYpBbia9ZoEykv8Em9m2fY1chfS1e7WZyTw3BZC4wxW4rnLxpDjP-juL4lcQ/exec";

    async function fetchData() {
        document.getElementById('statusText').innerText = "গুগল শিট থেকে সর্বশেষ ডাটা আনা হচ্ছে...";
        try {
            // doGet মেথড কল করে ডাটা রিসিভ করা
            const response = await fetch(scriptUrl);
            const data = await response.json();
            
            if(data) {
                updateDashboard(data.visits, data.fbClicks, data.chromeClicks);
                document.getElementById('statusText').innerText = "সর্বশেষ লাইভ আপডেট: এইমাত্র সফলভাবে সম্পন্ন হয়েছে।";
            }
        } catch (error) {
            console.log("Fetch Error:", error);
            document.getElementById('statusText').innerText = "ডাটা লোড করতে সমস্যা হয়েছে। দয়া করে নিশ্চিত করুন আপনার গুগল অ্যাপস স্ক্রিপ্টটি Anyone অ্যাক্সেস সহ সঠিকভাবে ডিপ্লয় করা হয়েছে কিনা।";
        }
    }

    function updateDashboard(visits, fb, chrome) {
        document.getElementById('totalVisits').innerText = visits;
        document.getElementById('fbClicks').innerText = fb;
        document.getElementById('chromeClicks').innerText = chrome;

        const totalClicks = fb + chrome || 1;
        const fbPercent = Math.round((fb / totalClicks) * 100);
        const chromePercent = Math.round((chrome / totalClicks) * 100);

        document.getElementById('fbPercent').innerText = fbPercent + "%";
        document.getElementById('fbBar').style.width = fbPercent + "%";

        document.getElementById('chromePercent').innerText = chromePercent + "%";
        document.getElementById('chromeBar').style.width = chromePercent + "%";
    }

    // পেজ ওপেন হওয়া মাত্রই অটো ডাটা লোড হবে
    window.onload = function() {
        fetchData();
    };
</script>
</body>
</html>
